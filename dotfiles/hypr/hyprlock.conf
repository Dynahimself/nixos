# Catppuccin Mocha Hyprlock

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $HOME/backgrounds/main.png
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    brightness = 0.72
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 86
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111baa)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(cba6f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(181825dd)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password…</span>
    hide_input = false
    rounding = 12
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(f9e2afff)
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] sh -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); [ -n "$cap" ] && echo "󰁹 $cap% ($st)" || echo ""'
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 28
    halign = center
    valign = bottom
}
