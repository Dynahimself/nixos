# Catppuccin Mocha Hyprlock — Dynamic Accent, Wallpaper, Media & Hardware Telemetry
$accent = rgba(cba6f7ff)
$accentAlt = rgba(89b4faff)
source = /home/dyna/.cache/mocha-theme/accent-hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/dyna/.cache/current-wallpaper
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 7
    noise = 0.014
    brightness = 0.62
    vibrancy = 0.18
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(11111bcc)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 56
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] sh -c 'echo "󰌽  $(whoami)@$(hostname)"'
    color = rgba(a6adc8cc)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.26
    dots_center = true
    outer_color = $accent $accentAlt 45deg
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    hide_input = false
    rounding = 13
    check_color = $accentAlt
    fail_color = rgba(f38ba8ff)
    fail_text = Wrong password ($ATTEMPTS)
    capslock_color = rgba(f9e2afff)
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] sh -c 'st=$(playerctl status 2>/dev/null || true); [ "$st" = "Playing" ] && playerctl metadata --format "󰎆  {{ artist }} — {{ title }}" 2>/dev/null | cut -c1-68 || echo ""'
    color = rgba(a6e3a1ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 62
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] sh -c '
      if ls /sys/class/power_supply/BAT* >/dev/null 2>&1; then
        cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1)
        st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1)
        left="󰁹 ${cap:-?}% (${st:-AC})"
      else
        cpu_raw=$(for h in /sys/class/hwmon/hwmon*; do n=$(cat "$h/name" 2>/dev/null); [ "$n" = "k10temp" ] || [ "$n" = "coretemp" ] && cat "$h/temp1_input" 2>/dev/null && break; done)
        gpu_raw=$(for h in /sys/class/hwmon/hwmon*; do n=$(cat "$h/name" 2>/dev/null); [ "$n" = "amdgpu" ] && [ -e "$h/temp2_input" ] && cat "$h/temp1_input" 2>/dev/null && break; done)
        cpu_c=$(( ${cpu_raw:-0} / 1000 ))
        gpu_c=$(( ${gpu_raw:-0} / 1000 ))
        left=" CPU ${cpu_c}°C  ·  󰢮 GPU ${gpu_c}°C"
      fi
      wifi=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: "/^yes/{print \$2; exit}")
      if [ -n "$wifi" ]; then
        net="󰤨 $wifi"
      else
        eth_ip=$(ip -4 -o addr show scope global 2>/dev/null | awk "\$2 !~ /^tailscale/ && \$2 !~ /^docker/ && \$2 !~ /^br-/ {sub(/\/.*/, \"\", \$4); print \$4; exit}")
        if [ -n "$eth_ip" ]; then
          net="󰈀 Ethernet ($eth_ip)"
        else
          net="󰤭 Offline"
        fi
      fi
      kb=$(hyprctl getoption input:kb_variant 2>/dev/null | grep -q colemak_dh && echo "Colemak-DH" || echo "QWERTY")
      echo "${left}  ·  ${net}  ·  󰌌 ${kb}"
    '
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 28
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] python3 -c 'import datetime,json,os; p=os.path.expanduser("~/.cache/cshub/waybar-snapshot.json"); d=json.load(open(p)) if os.path.exists(p) else {}; t=datetime.date.today(); its=[((datetime.date.fromisoformat(i["due_date"][:10])-t).days, i) for i in d.get("open_items",[]) if i.get("due_date")]; its=[x for x in its if x[0]<=7]; k=(its[0][1].get("kind") or "item").upper() if its else ""; ttl=(its[0][1].get("title") or "")[:40] if its else ""; crs=(" ["+its[0][1]["course"]+"]") if (its and its[0][1].get("course")) else ""; w=(f"{abs(its[0][0])}d LATE" if its[0][0]<0 else ("TODAY" if its[0][0]==0 else ("TOMORROW" if its[0][0]==1 else f"in {its[0][0]}d"))) if its else ""; print(f"󰑴  {k} {w}: {ttl}{crs}" if its else "")'
    color = rgba(fab387ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 92
    halign = center
    valign = bottom
}
