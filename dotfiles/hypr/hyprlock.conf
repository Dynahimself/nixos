# Catppuccin Mocha Hyprlock (real wallpaper path, Nerd Font Mono, status strip)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/dyna/backgrounds/main.png
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    brightness = 0.68
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111baa)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(cba6f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(181825ee)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    rounding = 12
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    fail_text = Wrong password ($ATTEMPTS)
    capslock_color = rgba(f9e2afff)
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); wifi=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: "/^yes/{print \$2; exit}"); kb=$(hyprctl getoption input:kb_variant 2>/dev/null | grep -q colemak_dh && echo "Colemak-DH" || echo "QWERTY"); echo "BAT ${cap:-?}% (${st:-AC})  ·  WIFI ${wifi:-Offline}  ·  KB ${kb}"'
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 28
    halign = center
    valign = bottom
}
