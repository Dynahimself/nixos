# Catppuccin Mocha Hyprlock — Dynamic Wallpaper, Media & Hardware Telemetry

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/dyna/.cache/current-wallpaper
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    brightness = 0.68
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111baa)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(cba6f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(181825ee)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    rounding = 12
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    fail_text = Wrong password ($ATTEMPTS)
    capslock_color = rgba(f9e2afff)
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] sh -c 'st=$(playerctl status 2>/dev/null || true); [ "$st" = "Playing" ] && playerctl metadata --format "󰎆  {{ artist }} — {{ title }}" 2>/dev/null | cut -c1-68 || echo ""'
    color = rgba(a6e3a1ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 62
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] sh -c '
      if ls /sys/class/power_supply/BAT* >/dev/null 2>&1; then
        cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1)
        st=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1)
        left="󰁹 ${cap:-?}% (${st:-AC})"
      else
        cpu_raw=$(for h in /sys/class/hwmon/hwmon*; do n=$(cat "$h/name" 2>/dev/null); [ "$n" = "k10temp" ] || [ "$n" = "coretemp" ] && cat "$h/temp1_input" 2>/dev/null && break; done)
        gpu_raw=$(for h in /sys/class/hwmon/hwmon*; do n=$(cat "$h/name" 2>/dev/null); [ "$n" = "amdgpu" ] && [ -e "$h/temp2_input" ] && cat "$h/temp1_input" 2>/dev/null && break; done)
        cpu_c=$(( ${cpu_raw:-0} / 1000 ))
        gpu_c=$(( ${gpu_raw:-0} / 1000 ))
        left=" CPU ${cpu_c}°C  ·  󰢮 GPU ${gpu_c}°C"
      fi
      wifi=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: "/^yes/{print \$2; exit}")
      if [ -n "$wifi" ]; then
        net="󰤨 $wifi"
      else
        eth_ip=$(ip -4 -o addr show scope global 2>/dev/null | awk "\$2 !~ /^tailscale/ && \$2 !~ /^docker/ && \$2 !~ /^br-/ {sub(/\/.*/, \"\", \$4); print \$4; exit}")
        if [ -n "$eth_ip" ]; then
          net="󰈀 Ethernet ($eth_ip)"
        else
          net="󰤭 Offline"
        fi
      fi
      kb=$(hyprctl getoption input:kb_variant 2>/dev/null | grep -q colemak_dh && echo "Colemak-DH" || echo "QWERTY")
      echo "${left}  ·  ${net}  ·  󰌌 ${kb}"
    '
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 28
    halign = center
    valign = bottom
}
