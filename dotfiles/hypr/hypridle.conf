# Catppuccin Mocha Hypridle — Smart Dim / Lock / Battery-Only Suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 5 min: dim backlight (laptop only — safe no-op on desktop)
listener {
    timeout = 300
    on-timeout = sh -c 'ls /sys/class/backlight/* >/dev/null 2>&1 && brightnessctl -s set 15% || true'
    on-resume = sh -c 'ls /sys/class/backlight/* >/dev/null 2>&1 && brightnessctl -r || true'
}

# 10 min: lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 12 min: screen off
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 20 min: suspend ONLY when on battery (never interrupts plugged-in builds/downloads)
listener {
    timeout = 1200
    on-timeout = sh -c 'grep -q Discharging /sys/class/power_supply/BAT*/status 2>/dev/null && systemctl suspend || true'
}
