# Catppuccin Mocha Hypridle — Smart Dim / Lock / Battery-Only Suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: dim backlight
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 10 min: lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 12 min: screen off
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 20 min: suspend ONLY when on battery (never interrupts plugged-in builds/downloads)
listener {
    timeout = 1200
    on-timeout = sh -c 'grep -q Discharging /sys/class/power_supply/BAT*/status 2>/dev/null && systemctl suspend'
}
