$mainMod = SUPER

# Core workflow actions
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, dolphin
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglesplit
bind = $mainMod, P, pin
bind = $mainMod CTRL, RETURN, exec, rofi -show drun
bind = $mainMod, B, exec, zen
bind = $mainMod SHIFT, B, exec, sh -c 'pkill -x waybar; pkill -x .waybar-wrapped; sleep 0.2; nohup setsid waybar >/tmp/waybar.log 2>&1 </dev/null &'
bind = $mainMod SHIFT, W, exec, rofi-wallpaper
bind = $mainMod, G, exec, sh -c 'if hyprctl getoption input:kb_variant | grep -q colemak_dh; then hyprctl eval "hl.config({ input = { kb_variant = \"\" } })" >/dev/null && notify-send "Keyboard" "Switched to QWERTY"; else hyprctl eval "hl.config({ input = { kb_variant = \"colemak_dh\" } })" >/dev/null && notify-send "Keyboard" "Switched to Colemak-DH"; fi'
bind = , Print, exec, hyprshot -m region

# Fleet, Workbench, System & QoL binds
bind = $mainMod, A, exec, rofi-fleet
bind = $mainMod, D, exec, rofi-workbench
bind = $mainMod, I, exec, rofi-system
bind = $mainMod, O, exec, rofi-audio
bind = $mainMod, W, exec, rofi-wifi
bind = $mainMod, SLASH, exec, rofi-binds
bind = $mainMod, V, exec, rofi-clip
bind = $mainMod, C, exec, rofi-calc
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod ALT, S, movetoworkspace, special:scratchpad
bind = $mainMod, N, exec, quick-note
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, I, exec, rofi-wallpaper
bind = $mainMod SHIFT, P, exec, wlogout -b 5 -p layer-shell
bind = $mainMod SHIFT, T, exec, cshub-term-capture
bind = $mainMod SHIFT, S, exec, sh -c 'if command -v satty >/dev/null; then grim -g "$(slurp)" - | satty -f -; else hyprshot -m region; fi'
bind = $mainMod, F1, exec, study-mode
bind = $mainMod, F2, exec, game-mode

# Scratchpad special workspace auto-spawns a floating ghostty
workspace = special:scratchpad, on-created-empty:ghostty

# Hardware / media keys
bindel = , XF86AudioRaiseVolume, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --output-volume raise || wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --output-volume lower || wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-'
bindel = , XF86MonBrightnessUp, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --brightness raise || brightnessctl set 10%+'
bindel = , XF86MonBrightnessDown, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --brightness lower || brightnessctl set 10%-'
bindl = , XF86AudioMute, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'
bindl = , XF86AudioMicMute, exec, sh -c 'command -v swayosd-client >/dev/null && swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = , XF86WLAN, exec, nmcli radio wifi toggle

# Focus, move, resize & monitor swap
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod, TAB, workspace, previous
bind = $mainMod, period, swapactiveworkspaces, DP-3 HDMI-A-1

# Workspaces 1..10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1..10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces & mouse drag
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
