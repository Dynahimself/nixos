# ─────────────────────────────
# Steam
# ─────────────────────────────
windowrule = match:class ^(steam)$, tile on
windowrule = match:class ^(steam)$, match:title ^(Friends List)$, float on
windowrule = match:class ^(steam)$, match:title ^(.*- event started.*)$, float on
windowrule = match:class ^(steam)$, match:title ^(.*- News.*)$, float on

# ─────────────────────────────
# Workspace routing
# ─────────────────────────────
windowrule = match:class ^(anki|org\.pwmt\.zathura|sioyek)$, workspace 4
windowrule = match:class ^(discord|vesktop|Spotify)$, workspace 5
windowrule = match:class ^(discord)$, tile on
windowrule = match:class ^(Spotify)$, tile on

# ─────────────────────────────
# Floating utility popups
# ─────────────────────────────
windowrule = match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|\.blueman-manager-wrapped|blueman-manager|nm-connection-editor|com\.gabm\.satty)$, float on
