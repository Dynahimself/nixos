# Session / portal environment (required so Dolphin/KDE/Electron apps don't crash portals)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start nixos-fake-graphical-session.target

# Core Mocha DE stack
exec-once = waybar
exec-once = sh -c 'if command -v awww-daemon >/dev/null; then awww-daemon & sleep 0.5 && (awww img "${HOME}/.cache/current-wallpaper" 2>/dev/null || awww img "${HOME}/backgrounds/main.png"); else hyprpaper; fi'
exec-once = swaync
exec-once = swayosd-server
exec-once = hypridle

# Clipboard history daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
