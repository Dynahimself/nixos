# Execute your favorite apps at launch
# --- session/portal fix (2026-09-06): Dolphin/KDE app launches were killing
# waybar+zen+nm-applet because graphical-session.target never started, so the
# xdg portal couldn't activate and D-Bus activation storms segfaulted clients.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start nixos-fake-graphical-session.target
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator

# Load configuration from ML4W Hyprland Settings App
exec = ~/.config/ml4w-hyprland-settings/hyprctl.sh
